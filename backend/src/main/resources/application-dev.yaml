spring:
  datasource:
    url: jdbc:h2:mem:hiveapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  # spring.mail.host is deliberately left unset: its mere presence switches email from the
  # logging fallback to real SMTP, so a default here would make every send fail whenever the
  # local catcher happens not to be running.
  #
  # To make credential links clickable, run a local catcher and set the two variables:
  #   mailpit                                   # SMTP on 1025, inbox at http://localhost:8025
  #   SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 mvn -f backend/pom.xml spring-boot:run …

hiveapp:
  offers:
    codes:
      pepper: dev-only-offer-code-pepper-change-before-deployment
  jwt:
    secret: dev-only-hiveapp-jwt-secret-change-before-deployment
  activation:
    base-url: http://localhost:3000
  billing:
    collection-enabled: false
    simulator:
      outcome: ${HIVEAPP_BILLING_SIMULATOR_OUTCOME:PENDING}
      failure-reason: ${HIVEAPP_BILLING_SIMULATOR_FAILURE_REASON:Configured simulated payment failure}
  admin:
    bootstrap:
      enabled: ${HIVEAPP_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${HIVEAPP_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${HIVEAPP_ADMIN_BOOTSTRAP_PASSWORD:}
      first-name: ${HIVEAPP_ADMIN_BOOTSTRAP_FIRST_NAME:Platform}
      last-name: ${HIVEAPP_ADMIN_BOOTSTRAP_LAST_NAME:Administrator}
