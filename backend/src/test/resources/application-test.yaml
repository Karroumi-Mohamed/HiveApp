spring:
  datasource:
    url: jdbc:h2:mem:hiveapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

hiveapp:
  offers:
    codes:
      pepper: test-only-offer-code-pepper-never-use-in-production
  jwt:
    secret: test-only-hiveapp-jwt-secret-never-use-in-deployment
  activation:
    base-url: http://localhost:5173
  billing:
    collection-enabled: false
    simulator:
      outcome: PENDING
  admin:
    bootstrap:
      enabled: true
      email: test-admin@hiveapp.local
      password: test-only-admin-password
      first-name: Test
      last-name: Administrator
